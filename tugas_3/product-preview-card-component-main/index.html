<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary-green": "hsl(158, 36%, 37%)",
              "primary-green-dark": "hsl(158, 42%, 18%)",
              "neutral-black": "hsl(212, 21%, 14%)",
              "neutral-grey": "hsl(228, 12%, 48%)",
              "neutral-cream": "hsl(30, 38%, 92%)",
            },
            fontFamily: {
              montserrat: ["Montserrat", "sans-serif"],
              fraunces: ["Fraunces", "serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-neutral-cream font-montserrat min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="bg-white rounded-lg overflow-hidden max-w-xl w-full flex flex-col md:flex-row shadow-xl"
    >
      <div class="md:w-1/2">
        <img
          src="images/image-product-desktop.jpg"
          class="w-full h-full object-cover hidden md:block"
        />
        <img
          src="images/image-product-mobile.jpg"
          class="w-full h-full object-cover md:hidden block"
        />
      </div>
      <div class="p-6 md:p-8 md:w-1/2 flex flex-col justify-center">
        <p
          class="text-neutral-grey uppercase tracking-widest text-xs mb-3 font-medium"
        >
          Perfume
        </p>

        <h1
          class="font-fraunces text-3xl md:text-4xl neutral-black font-bold mb-4 leading-none"
        >
          Gabrielle Essence Eau De Parfum
        </h1>

        <p class="text-neutral-grey text-sm mb-6 leading-relaxed">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="flex items-center gap-5 mb-5">
          <span
            class="font-fraunces text-3xl md:text-4xl text-primary-green font-bold"
          >
            $149.99
          </span>
          <span class="text-neutral-grey line-through text-sm"> $169.99 </span>
        </div>

        <button
          class="bg-primary-green flex hover:bg-primary-green-dark text-white font-bold py-4 md:px-6 rounded-lg w-full items-center justify-center gap-3 transition-colors duration-200"
        >
          <svg width="15" height="16" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M14.383 10.388a2.397 2.397 0 0 0-1.518-2.222l1.494-5.593a.8.8 0 0 0-.144-.695.8.8 0 0 0-.631-.28H2.637L2.373.591A.8.8 0 0 0 1.598 0H0v1.598h.983l1.982 7.4a.8.8 0 0 0 .799.59h8.222a.8.8 0 0 1 0 1.599H1.598a.8.8 0 1 0 0 1.598h.943a2.397 2.397 0 1 0 4.507 0h1.885a2.397 2.397 0 1 0 4.331-.376 2.397 2.397 0 0 0 1.12-2.021ZM11.26 7.99H4.395L3.068 3.196h9.477L11.26 7.991Zm-6.465 6.392a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Zm6.393 0a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Z"
              fill="currentColor"
            />
          </svg>

          Add to Cart
        </button>
      </div>
    </div>
  </body>
</html>
